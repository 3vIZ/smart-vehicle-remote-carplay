<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Vehicle Remote & CarPlay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            500: '#22c55e',
                            600: '#16a34a',
                        }
                    },
                    screens: {
                        'xs': '380px'
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom UI Tweaks and animations */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .car-glow {
            filter: drop-shadow(0 0 15px rgba(59, 130, 246, 0.35));
        }
        .pulse-slow {
            animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .4; }
        }
        /* Custom scrollbars */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="h-full bg-black text-slate-100 flex flex-col justify-between overflow-x-hidden selection:bg-blue-500 selection:text-white">

    <div id="app" class="max-w-md mx-auto w-full min-h-screen flex flex-col bg-slate-950 relative pb-8">
        
        <!-- App Header (No native status bar to avoid duplication) -->
        <header class="px-5 pt-4 pb-2 flex items-center justify-between z-10">
            <div class="flex items-center space-x-2">
                <button id="garageMenuBtn" class="w-9 h-9 rounded-full bg-slate-900 border border-slate-800 flex items-center justify-center text-slate-400 hover:text-white active:scale-95 transition" title="Vehicle Garage">
                    <i class="fa-solid fa-car text-sm"></i>
                </button>
            </div>
            
            <!-- Editable Car Name -->
            <div class="flex items-center gap-2 group">
                <input id="carNameInput" type="text" value="Car 1" class="bg-transparent text-center font-bold text-lg text-white border-b border-transparent hover:border-slate-700 focus:border-blue-500 focus:outline-none px-1 py-0.5 rounded transition max-w-[140px]" title="Tap to rename car">
                <i class="fa-solid fa-pen text-xs text-slate-500 opacity-60 group-hover:opacity-100"></i>
            </div>

            <div class="flex items-center space-x-2">
                <button id="carplayToggleBtn" class="px-3 py-1.5 rounded-full bg-blue-600/20 border border-blue-500/40 text-blue-400 font-semibold text-xs flex items-center gap-1.5 active:scale-95 transition">
                    <i class="fa-solid fa-display text-xs"></i>
                    <span>CarPlay</span>
                </button>
                <button id="settingsMenuBtn" class="w-9 h-9 rounded-full bg-slate-900 border border-slate-800 flex items-center justify-center text-slate-400 hover:text-white active:scale-95 transition" title="Vehicle Settings">
                    <i class="fa-solid fa-ellipsis"></i>
                </button>
            </div>
        </header>

        <!-- Status Badges & Quick Info -->
        <div class="px-5 my-1 flex items-center justify-center gap-2 text-xs">
            <span id="connectionBadge" class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                Connected
            </span>
            <button id="requestNotifBtn" class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20 hover:bg-amber-500/20 transition">
                <i class="fa-solid fa-bell-slash text-[10px]" id="notifIcon"></i>
                <span id="notifStatusText">Enable Alerts</span>
            </button>
        </div>

        <!-- MAIN REMOTE VIEW -->
        <main id="remoteView" class="flex-1 flex flex-col justify-between px-5 py-2 space-y-4">
            
            <!-- Toy Ride-On Car Graphic (Matching User Photo) -->
            <div class="relative w-full h-52 flex items-center justify-center my-1">
                <!-- Charger Cable Visual Connection when charging -->
                <svg id="chargerCable" class="absolute inset-0 w-full h-full pointer-events-none z-0 transition-opacity duration-500 opacity-0" viewBox="0 0 300 200">
                    <path d="M 10 120 C 60 20, 100 30, 145 75" fill="none" stroke="#3b82f6" stroke-width="6" stroke-linecap="round" stroke-dasharray="8 4" class="animate-pulse"/>
                </svg>

                <!-- Yellow Toy Ride-On Car SVG Illustration -->
                <svg class="w-48 h-48 car-glow transition-all duration-300 z-10" viewBox="0 0 200 220" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Handle Bar / Push Bar on top -->
                    <path d="M 65 50 C 65 20, 135 20, 135 50 L 125 70 L 75 70 Z" fill="#7e22ce" stroke="#a855f7" stroke-width="3"/>
                    <rect x="70" y="20" width="60" height="12" rx="6" fill="#6b21a8"/>

                    <!-- Main Yellow Body structure -->
                    <path d="M 40 90 C 40 70, 160 70, 160 90 L 170 180 C 170 195, 160 200, 100 200 C 40 200, 30 195, 30 180 Z" fill="#fbbf24" stroke="#d97706" stroke-width="4"/>
                    
                    <!-- Top Hood accent (Purple/Blue) -->
                    <path d="M 45 88 C 45 75, 155 75, 155 88 L 158 115 C 158 118, 42 118, 42 115 Z" fill="#9333ea"/>

                    <!-- Playful Eyes / Headlights -->
                    <!-- Left Eye -->
                    <circle cx="70" cy="140" r="20" fill="#3b82f6" stroke="#1d4ed8" stroke-width="3"/>
                    <circle cx="70" cy="140" r="14" fill="#fbbf24"/>
                    <circle cx="65" cy="135" r="5" fill="#1e1b4b"/>
                    
                    <!-- Right Eye / Clock Toy Dial -->
                    <circle cx="130" cy="140" r="20" fill="#ef4444" stroke="#b91c1c" stroke-width="3"/>
                    <circle cx="130" cy="140" r="14" fill="#fef08a"/>
                    <!-- Clock hands inside right eye -->
                    <line x1="130" y1="140" x2="130" y2="131" stroke="#b91c1c" stroke-width="2.5" stroke-linecap="round"/>
                    <line x1="130" y1="140" x2="138" y2="140" stroke="#b91c1c" stroke-width="2.5" stroke-linecap="round"/>

                    <!-- Cute Smile Nose/Mouth -->
                    <circle cx="100" cy="162" r="4" fill="#1e293b"/>

                    <!-- Front Red Bumper / Footrest -->
                    <rect x="35" y="180" width="130" height="16" rx="6" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
                    <rect x="55" y="185" width="90" height="6" rx="3" fill="#60a5fa"/>

                    <!-- Wheels -->
                    <rect x="30" y="196" width="30" height="12" rx="4" fill="#1e293b"/>
                    <rect x="140" y="196" width="30" height="12" rx="4" fill="#1e293b"/>

                    <!-- Headlight Beams (Active when started) -->
                    <g id="headlightBeams" class="transition-opacity duration-300 opacity-0">
                        <polygon points="50,140 10,120 10,160" fill="url(#lightGradient)" opacity="0.6"/>
                        <polygon points="150,140 190,120 190,160" fill="url(#lightGradientRight)" opacity="0.6"/>
                    </g>

                    <defs>
                        <linearGradient id="lightGradient" x1="50" y1="140" x2="10" y2="140" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#fef08a" stop-opacity="0.8"/>
                            <stop offset="1" stop-color="#fef08a" stop-opacity="0"/>
                        </linearGradient>
                        <linearGradient id="lightGradientRight" x1="150" y1="140" x2="190" y2="140" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#fef08a" stop-opacity="0.8"/>
                            <stop offset="1" stop-color="#fef08a" stop-opacity="0"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>

            <!-- Primary Vehicle Control Buttons grid -->
            <div class="grid grid-cols-4 gap-3">
                
                <!-- Lock / Unlock Button -->
                <button id="lockBtn" class="flex flex-col items-center justify-center p-3 rounded-2xl bg-slate-900 border border-slate-800 active:scale-95 transition shadow-lg hover:border-slate-700">
                    <div id="lockIconBg" class="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center text-slate-300 mb-1.5 transition">
                        <i id="lockIcon" class="fa-solid fa-lock text-sm"></i>
                    </div>
                    <span id="lockStatusText" class="text-[11px] font-medium text-slate-300">Locked</span>
                </button>

                <!-- Engine Start/Stop -->
                <button id="engineBtn" class="flex flex-col items-center justify-center p-3 rounded-2xl bg-slate-900 border border-slate-800 active:scale-95 transition shadow-lg hover:border-slate-700">
                    <div id="engineIconBg" class="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center text-slate-300 mb-1.5 transition">
                        <i class="fa-solid fa-power-off text-sm"></i>
                    </div>
                    <span id="engineStatusText" class="text-[11px] font-medium text-slate-300">Start</span>
                </button>

                <!-- Climate / Cabin Air -->
                <button id="climateBtn" class="flex flex-col items-center justify-center p-3 rounded-2xl bg-slate-900 border border-slate-800 active:scale-95 transition shadow-lg hover:border-slate-700">
                    <div id="climateIconBg" class="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center text-slate-300 mb-1.5 transition">
                        <i class="fa-solid fa-fan text-sm"></i>
                    </div>
                    <span id="climateStatusText" class="text-[11px] font-medium text-slate-300">Climate</span>
                </button>

                <!-- Flash Lights / Horn -->
                <button id="flashBtn" class="flex flex-col items-center justify-center p-3 rounded-2xl bg-slate-900 border border-slate-800 active:scale-95 transition shadow-lg hover:border-slate-700">
                    <div class="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center text-slate-300 mb-1.5">
                        <i class="fa-solid fa-bullhorn text-sm"></i>
                    </div>
                    <span class="text-[11px] font-medium text-slate-300">Flash</span>
                </button>
            </div>

            <!-- Battery & Charging Control Card -->
            <div class="p-4 rounded-2xl bg-slate-900/90 border border-slate-800/80 shadow-xl space-y-3">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2.5">
                        <div class="w-8 h-8 rounded-lg bg-blue-500/10 border border-blue-500/20 flex items-center justify-center text-blue-400">
                            <i id="batteryHeaderIcon" class="fa-solid fa-bolt text-xs"></i>
                        </div>
                        <div>
                            <div class="text-xs text-slate-400 font-medium">Battery Level</div>
                            <div id="chargingStateLabel" class="text-[10px] text-slate-500">Not Charging</div>
                        </div>
                    </div>
                    <div class="text-right">
                        <div id="batteryPercentageText" class="text-xl font-bold text-white tracking-tight">78%</div>
                        <div id="rangeEstimateText" class="text-[10px] text-slate-400">Est. 210 mi</div>
                    </div>
                </div>

                <!-- Progress Bar -->
                <div class="w-full bg-slate-800 h-2.5 rounded-full overflow-hidden p-0.5 border border-slate-700/50">
                    <div id="batteryProgressBar" class="bg-gradient-to-r from-blue-500 to-emerald-400 h-full rounded-full transition-all duration-500" style="width: 78%"></div>
                </div>

                <!-- Charging Mode Toggle Buttons (Fixed Mobile Responsive Layout) -->
                <div class="pt-1 border-t border-slate-800/60 flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-2">
                    <span class="text-xs text-slate-400 font-medium">Charger Mode:</span>
                    <div class="grid grid-cols-2 gap-1.5 p-1 bg-slate-950 rounded-xl border border-slate-800 w-full sm:w-auto">
                        <button id="chargeOnBtn" class="flex items-center justify-center gap-1.5 px-3 py-2 rounded-lg text-xs font-medium transition-all">
                            <i class="fa-solid fa-bolt text-[10px]"></i>
                            <span>Charging</span>
                        </button>
                        <button id="chargeOffBtn" class="flex items-center justify-center gap-1.5 px-3 py-2 rounded-lg text-xs font-medium transition-all">
                            <i class="fa-solid fa-plug-circle-xmark text-[10px]"></i>
                            <span>Stopped</span>
                        </button>
                    </div>
                </div>

                <!-- Instant Minute Simulation Button for testing -->
                <div class="flex items-center justify-between text-[11px] text-slate-500 pt-1">
                    <span>Updates live every 1 min</span>
                    <button id="simMinuteBtn" class="text-blue-400 hover:text-blue-300 underline flex items-center gap-1 active:scale-95">
                        <i class="fa-solid fa-forward-step text-[9px]"></i> Simulate +1 min
                    </button>
                </div>
            </div>

            <!-- Climate & Status Card -->
            <div class="grid grid-cols-2 gap-3">
                
                <!-- Interior Temp Control -->
                <div class="p-3.5 rounded-2xl bg-slate-900 border border-slate-800 flex flex-col justify-between space-y-2">
                    <div class="flex items-center justify-between text-xs text-slate-400">
                        <span>Interior Temp</span>
                        <i class="fa-solid fa-temperature-half text-blue-400"></i>
                    </div>
                    <div class="flex items-baseline justify-between">
                        <span id="tempDisplay" class="text-xl font-bold text-white">70°F</span>
                        <div class="flex items-center gap-1">
                            <button id="tempDownBtn" class="w-6 h-6 rounded-md bg-slate-800 text-slate-300 text-xs flex items-center justify-center active:scale-90">-</button>
                            <button id="tempUpBtn" class="w-6 h-6 rounded-md bg-slate-800 text-slate-300 text-xs flex items-center justify-center active:scale-90">+</button>
                        </div>
                    </div>
                </div>

                <!-- Tire Pressure / Quick Info -->
                <div class="p-3.5 rounded-2xl bg-slate-900 border border-slate-800 flex flex-col justify-between space-y-2">
                    <div class="flex items-center justify-between text-xs text-slate-400">
                        <span>Tire Pressure</span>
                        <i class="fa-solid fa-dharmachakra text-emerald-400"></i>
                    </div>
                    <div class="flex items-baseline justify-between">
                        <span class="text-xl font-bold text-white">36 <span class="text-xs text-slate-400 font-normal">PSI</span></span>
                        <span class="text-[10px] px-1.5 py-0.5 rounded bg-emerald-500/10 text-emerald-400">Normal</span>
                    </div>
                </div>

            </div>

        </main>

        <!-- FAKE CARPLAY INTERACTIVE VIEW -->
        <div id="carplayView" class="hidden absolute inset-0 bg-slate-950 z-30 flex flex-col p-4 overflow-hidden">
            
            <!-- CarPlay Header Nav Bar -->
            <div class="flex items-center justify-between pb-3 border-b border-slate-800">
                <div class="flex items-center gap-2">
                    <span id="carplayTime" class="text-sm font-semibold text-white">9:41 AM</span>
                    <span class="text-xs px-2 py-0.5 rounded-md bg-blue-600/30 text-blue-300 border border-blue-500/30">CarPlay</span>
                </div>
                <button id="exitCarplayBtn" class="px-3 py-1 rounded-full bg-slate-800 text-slate-300 text-xs flex items-center gap-1 hover:bg-slate-700">
                    <i class="fa-solid fa-xmark text-xs"></i> Exit Remote
                </button>
            </div>

            <!-- Dashboard Split Layout -->
            <div class="flex-1 grid grid-cols-1 gap-3 py-3 overflow-y-auto">
                
                <!-- Fake Navigation Map Card -->
                <div class="h-44 rounded-2xl bg-slate-900 border border-slate-800 relative overflow-hidden flex flex-col justify-between p-3">
                    <div class="absolute inset-0 opacity-40 bg-[radial-gradient(#3b82f6_1px,transparent_1px)] [background-size:16px_16px]"></div>
                    <div class="relative z-10 flex items-center justify-between">
                        <div class="flex items-center gap-2 bg-slate-950/80 px-2.5 py-1 rounded-lg border border-slate-800">
                            <i class="fa-solid fa-location-arrow text-blue-400 text-xs"></i>
                            <span class="text-xs text-slate-200 font-medium">Navigating to Home</span>
                        </div>
                        <span class="text-xs text-emerald-400 font-semibold">12 min (4.2 mi)</span>
                    </div>

                    <div class="relative z-10 flex items-center justify-between bg-slate-950/90 p-2.5 rounded-xl border border-slate-800">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center text-white">
                                <i class="fa-solid fa-arrow-turn-up text-sm"></i>
                            </div>
                            <div>
                                <div class="text-xs font-semibold text-white">In 500 feet</div>
                                <div class="text-[10px] text-slate-400">Turn right on Main Street</div>
                            </div>
                        </div>
                        <button class="w-7 h-7 rounded-full bg-slate-800 text-slate-300 flex items-center justify-center text-xs">
                            <i class="fa-solid fa-volume-high"></i>
                        </button>
                    </div>
                </div>

                <!-- Fake Music Player Card -->
                <div class="p-3.5 rounded-2xl bg-slate-900 border border-slate-800 flex items-center justify-between gap-3">
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-purple-600 to-pink-500 flex items-center justify-center text-white text-lg shadow-lg">
                            <i class="fa-solid fa-music"></i>
                        </div>
                        <div>
                            <div class="text-xs font-semibold text-white">Midnight Drive</div>
                            <div class="text-[10px] text-slate-400">Synthwave Beats</div>
                        </div>
                    </div>
                    
                    <div class="flex items-center gap-2">
                        <button class="w-8 h-8 rounded-full bg-slate-800 text-slate-300 flex items-center justify-center text-xs active:scale-90">
                            <i class="fa-solid fa-backward"></i>
                        </button>
                        <button id="carplayPlayBtn" class="w-9 h-9 rounded-full bg-white text-slate-950 flex items-center justify-center text-xs active:scale-90">
                            <i class="fa-solid fa-play"></i>
                        </button>
                        <button class="w-8 h-8 rounded-full bg-slate-800 text-slate-300 flex items-center justify-center text-xs active:scale-90">
                            <i class="fa-solid fa-forward"></i>
                        </button>
                    </div>
                </div>

                <!-- CarPlay App Icons Grid -->
                <div class="grid grid-cols-4 gap-3 pt-1">
                    <button class="flex flex-col items-center gap-1 active:scale-90 transition">
                        <div class="w-12 h-12 rounded-2xl bg-emerald-600 flex items-center justify-center text-white text-lg shadow">
                            <i class="fa-solid fa-phone"></i>
                        </div>
                        <span class="text-[10px] text-slate-300">Phone</span>
                    </button>
                    <button class="flex flex-col items-center gap-1 active:scale-90 transition">
                        <div class="w-12 h-12 rounded-2xl bg-blue-500 flex items-center justify-center text-white text-lg shadow">
                            <i class="fa-solid fa-map"></i>
                        </div>
                        <span class="text-[10px] text-slate-300">Maps</span>
                    </button>
                    <button class="flex flex-col items-center gap-1 active:scale-90 transition">
                        <div class="w-12 h-12 rounded-2xl bg-pink-600 flex items-center justify-center text-white text-lg shadow">
                            <i class="fa-solid fa-radio"></i>
                        </div>
                        <span class="text-[10px] text-slate-300">Music</span>
                    </button>
                    <button class="flex flex-col items-center gap-1 active:scale-90 transition">
                        <div class="w-12 h-12 rounded-2xl bg-amber-600 flex items-center justify-center text-white text-lg shadow">
                            <i class="fa-solid fa-podcast"></i>
                        </div>
                        <span class="text-[10px] text-slate-300">Podcasts</span>
                    </button>
                </div>

            </div>

            <!-- Siri/Voice Prompt -->
            <div class="pt-2 flex justify-center">
                <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 p-0.5 shadow-lg animate-pulse">
                    <div class="w-full h-full bg-slate-950 rounded-full flex items-center justify-center text-slate-200">
                        <i class="fa-solid fa-microphone text-xs"></i>
                    </div>
                </div>
            </div>

        </div>

        <!-- Notification / Toast Container -->
        <div id="toastContainer" class="fixed top-4 left-1/2 -translate-x-1/2 w-11/12 max-w-xs z-50 pointer-events-none space-y-2"></div>

        <!-- Garage / Vehicle Selector Modal -->
        <div id="garageModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5 w-full max-w-xs space-y-4 shadow-2xl">
                <div class="flex items-center justify-between">
                    <h3 class="font-bold text-white text-base flex items-center gap-2">
                        <i class="fa-solid fa-garage text-blue-400"></i> Garage & Cars
                    </h3>
                    <button id="closeGarageBtn" class="w-7 h-7 rounded-full bg-slate-800 text-slate-400 hover:text-white text-xs flex items-center justify-center">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                
                <div id="garageList" class="space-y-2">
                    <!-- Populated dynamically -->
                </div>

                <button id="addCarBtn" class="w-full py-2.5 rounded-xl border border-dashed border-slate-700 text-slate-400 text-xs font-medium hover:border-slate-500 hover:text-slate-200 transition flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-plus text-[10px]"></i> Add Another Vehicle
                </button>
            </div>
        </div>

        <!-- Vehicle Settings & Diagnostics Modal -->
        <div id="settingsModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5 w-full max-w-xs space-y-4 shadow-2xl">
                <div class="flex items-center justify-between">
                    <h3 class="font-bold text-white text-base flex items-center gap-2">
                        <i class="fa-solid fa-sliders text-blue-400"></i> Vehicle Controls
                    </h3>
                    <button id="closeSettingsBtn" class="w-7 h-7 rounded-full bg-slate-800 text-slate-400 hover:text-white text-xs flex items-center justify-center">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>

                <div class="space-y-2 text-xs">
                    <button id="valetModeBtn" class="w-full p-3 rounded-2xl bg-slate-950 border border-slate-800 flex items-center justify-between active:scale-95 transition">
                        <div class="flex items-center gap-2.5">
                            <i class="fa-solid fa-user-shield text-emerald-400"></i>
                            <span class="text-slate-200 font-medium">Valet Speed Limit</span>
                        </div>
                        <span id="valetStatusText" class="text-[10px] px-2 py-0.5 rounded bg-slate-800 text-slate-400">OFF</span>
                    </button>

                    <button id="runDiagBtn" class="w-full p-3 rounded-2xl bg-slate-950 border border-slate-800 flex items-center justify-between active:scale-95 transition">
                        <div class="flex items-center gap-2.5">
                            <i class="fa-solid fa-microchip text-blue-400"></i>
                            <span class="text-slate-200 font-medium">Full System Health Check</span>
                        </div>
                        <i class="fa-solid fa-chevron-right text-slate-600 text-xs"></i>
                    </button>

                    <button id="panicAlarmBtn" class="w-full p-3 rounded-2xl bg-red-500/10 border border-red-500/30 text-red-400 flex items-center justify-between active:scale-95 transition">
                        <div class="flex items-center gap-2.5">
                            <i class="fa-solid fa-triangle-exclamation"></i>
                            <span class="font-medium">Trigger Panic Alarm</span>
                        </div>
                        <i class="fa-solid fa-bullhorn text-xs"></i>
                    </button>
                </div>

                <button id="resetAppBtn" class="w-full py-2 rounded-xl text-[11px] text-slate-500 hover:text-slate-300 transition text-center">
                    Reset All Car Settings
                </button>
            </div>
        </div>

    </div>

    <script>
        const DEFAULT_CAR = {
            id: 'car_1',
            carName: "Car 1",
            isLocked: true,
            engineOn: false,
            climateOn: false,
            targetTemp: 70,
            isCharging: false,
            batteryLevel: 78
        };

        const PRESET_CARS = [
            DEFAULT_CAR,
            {
                id: 'car_2',
                carName: "Tesla Model Y",
                isLocked: false,
                engineOn: true,
                climateOn: true,
                targetTemp: 68,
                isCharging: true,
                batteryLevel: 92
            }
        ];

        let garage = loadGarage();
        let activeCarId = localStorage.getItem('apex_active_car_id') || garage[0].id;
        let appState = getActiveCarState();
        let unlockTimer = null;

        function loadGarage() {
            try {
                const saved = localStorage.getItem('apex_garage_cars');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (Array.isArray(parsed) && parsed.length > 0) return parsed;
                }
            } catch (e) {
                console.error("Could not load garage", e);
            }
            return JSON.parse(JSON.stringify(PRESET_CARS));
        }

        function saveGarage() {
            const carIndex = garage.findIndex(c => c.id === activeCarId);
            if (carIndex !== -1) {
                garage[carIndex] = { ...appState };
            }
            localStorage.setItem('apex_garage_cars', JSON.stringify(garage));
            localStorage.setItem('apex_active_car_id', activeCarId);
        }

        function getActiveCarState() {
            let car = garage.find(c => c.id === activeCarId);
            if (!car) {
                car = garage[0];
                activeCarId = car.id;
            }
            return car;
        }

        function switchCar(carId) {
            saveGarage();
            activeCarId = carId;
            appState = getActiveCarState();
            saveState();
            showToast(`Switched to ${appState.carName}`, "success");
        }

        function saveState() {
            saveGarage();
            updateUI();
            checkUnlockNotificationTimer();
            checkLowBatteryAlert();
        }

        function checkUnlockNotificationTimer() {
            if (unlockTimer) clearTimeout(unlockTimer);
            if (!appState.isLocked) {
                unlockTimer = setTimeout(() => {
                    sendUnlockedAlert();
                }, 30000);
            }
        }

        function checkLowBatteryAlert() {
            if (appState.batteryLevel <= 20 && !appState.isCharging) {
                showToast(`Low Battery Warning (${appState.batteryLevel}%)`, "info");
            }
        }

        function sendUnlockedAlert() {
            const vehicleName = appState.carName || "Your car";
            const alertMsg = `${vehicleName} has been left unlocked. Tap to lock.`;

            if ("Notification" in window && Notification.permission === "granted") {
                const notif = new Notification(`${vehicleName} Security Alert`, {
                    body: alertMsg,
                    requireInteraction: true
                });
                notif.onclick = () => {
                    window.focus();
                    appState.isLocked = true;
                    saveState();
                    showToast(`${vehicleName} locked safely!`, "success");
                    notif.close();
                };
            }

            showActionableToast(alertMsg, "Lock Now", () => {
                appState.isLocked = true;
                saveState();
                showToast(`${vehicleName} locked!`, "success");
            });
        }

        function requestNotificationPermission() {
            if (!("Notification" in window)) {
                showToast("Browser notifications not supported", "info");
                return;
            }

            Notification.requestPermission().then(permission => {
                updateNotifBadge();
                if (permission === "granted") {
                    showToast("Alerts enabled!", "success");
                } else {
                    showToast("Notifications disabled. Using in-app alerts.", "info");
                }
            });
        }

        function updateNotifBadge() {
            const btn = document.getElementById('requestNotifBtn');
            const icon = document.getElementById('notifIcon');
            const text = document.getElementById('notifStatusText');

            if ("Notification" in window && Notification.permission === "granted") {
                btn.className = "inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 hover:bg-emerald-500/20 transition";
                icon.className = "fa-solid fa-bell text-[10px]";
                text.textContent = "Alerts Active";
            } else {
                btn.className = "inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20 hover:bg-amber-500/20 transition";
                icon.className = "fa-solid fa-bell-slash text-[10px]";
                text.textContent = "Enable Alerts";
            }
        }

        function renderGarageList() {
            const list = document.getElementById('garageList');
            list.innerHTML = '';

            garage.forEach(car => {
                const isActive = car.id === activeCarId;
                const btn = document.createElement('button');
                btn.className = isActive 
                    ? "w-full p-3 rounded-2xl bg-blue-600/20 border border-blue-500/50 flex items-center justify-between text-left transition"
                    : "w-full p-3 rounded-2xl bg-slate-950 border border-slate-800 flex items-center justify-between text-left opacity-70 hover:opacity-100 active:scale-95 transition";
                
                btn.innerHTML = `
                    <div>
                        <div class="text-xs font-semibold text-white">${car.carName}</div>
                        <div class="text-[10px] ${isActive ? 'text-blue-400' : 'text-slate-500'}">
                            ${isActive ? 'Active Vehicle' : `${car.batteryLevel}% Battery • ${car.isLocked ? 'Locked' : 'Unlocked'}`}
                        </div>
                    </div>
                    ${isActive ? '<i class="fa-solid fa-circle-check text-blue-400"></i>' : '<i class="fa-solid fa-chevron-right text-xs text-slate-600"></i>'}
                `;

                btn.addEventListener('click', () => {
                    if (!isActive) switchCar(car.id);
                    document.getElementById('garageModal').classList.add('hidden');
                });

                list.appendChild(btn);
            });
        }

        function updateUI() {
            const nameInput = document.getElementById('carNameInput');
            if (document.activeElement !== nameInput) {
                nameInput.value = appState.carName;
            }

            const lockIconBg = document.getElementById('lockIconBg');
            const lockIcon = document.getElementById('lockIcon');
            const lockStatusText = document.getElementById('lockStatusText');

            if (appState.isLocked) {
                lockIconBg.className = "w-10 h-10 rounded-full bg-slate-800 text-slate-300 flex items-center justify-center mb-1.5 transition";
                lockIcon.className = "fa-solid fa-lock text-sm";
                lockStatusText.textContent = "Locked";
                lockStatusText.className = "text-[11px] font-medium text-slate-300";
            } else {
                lockIconBg.className = "w-10 h-10 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center mb-1.5 transition";
                lockIcon.className = "fa-solid fa-lock-open text-sm";
                lockStatusText.textContent = "Unlocked";
                lockStatusText.className = "text-[11px] font-medium text-emerald-400";
            }

            const engineIconBg = document.getElementById('engineIconBg');
            const engineStatusText = document.getElementById('engineStatusText');
            const headlightBeams = document.getElementById('headlightBeams');

            if (appState.engineOn) {
                engineIconBg.className = "w-10 h-10 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center mb-1.5 transition animate-pulse";
                engineStatusText.textContent = "Running";
                engineStatusText.className = "text-[11px] font-medium text-emerald-400";
                headlightBeams.style.opacity = "1";
            } else {
                engineIconBg.className = "w-10 h-10 rounded-full bg-slate-800 text-slate-300 flex items-center justify-center mb-1.5 transition";
                engineStatusText.textContent = "Start";
                engineStatusText.className = "text-[11px] font-medium text-slate-300";
                headlightBeams.style.opacity = "0";
            }

            const climateIconBg = document.getElementById('climateIconBg');
            const climateStatusText = document.getElementById('climateStatusText');

            if (appState.climateOn) {
                climateIconBg.className = "w-10 h-10 rounded-full bg-blue-500/20 text-blue-400 flex items-center justify-center mb-1.5 transition animate-spin";
                climateStatusText.textContent = `ON (${appState.targetTemp}°)`;
                climateStatusText.className = "text-[11px] font-medium text-blue-400";
            } else {
                climateIconBg.className = "w-10 h-10 rounded-full bg-slate-800 text-slate-300 flex items-center justify-center mb-1.5 transition";
                climateStatusText.textContent = "Climate";
                climateStatusText.className = "text-[11px] font-medium text-slate-300";
            }

            document.getElementById('tempDisplay').textContent = `${appState.targetTemp}°F`;

            document.getElementById('batteryPercentageText').textContent = `${appState.batteryLevel}%`;
            document.getElementById('batteryProgressBar').style.width = `${appState.batteryLevel}%`;
            document.getElementById('rangeEstimateText').textContent = `Est. ${Math.round(appState.batteryLevel * 2.7)} mi`;

            const chargerCable = document.getElementById('chargerCable');
            const chargingStateLabel = document.getElementById('chargingStateLabel');
            const batteryHeaderIcon = document.getElementById('batteryHeaderIcon');
            const chargeOnBtn = document.getElementById('chargeOnBtn');
            const chargeOffBtn = document.getElementById('chargeOffBtn');

            if (appState.isCharging) {
                chargerCable.style.opacity = "1";
                chargingStateLabel.textContent = "Fast Charging";
                chargingStateLabel.className = "text-[10px] text-emerald-400 font-medium";
                batteryHeaderIcon.className = "fa-solid fa-bolt text-xs text-emerald-400 animate-bounce";

                chargeOnBtn.className = "flex items-center justify-center gap-1.5 px-3 py-2 rounded-lg text-xs font-medium transition-all bg-emerald-600 text-white shadow";
                chargeOffBtn.className = "flex items-center justify-center gap-1.5 px-3 py-2 rounded-lg text-xs font-medium transition-all text-slate-400 hover:text-white";
            } else {
                chargerCable.style.opacity = "0";
                chargingStateLabel.textContent = "Disconnected";
                chargingStateLabel.className = "text-[10px] text-slate-500";
                batteryHeaderIcon.className = "fa-solid fa-plug text-xs text-slate-400";

                chargeOnBtn.className = "flex items-center justify-center gap-1.5 px-3 py-2 rounded-lg text-xs font-medium transition-all text-slate-400 hover:text-white";
                chargeOffBtn.className = "flex items-center justify-center gap-1.5 px-3 py-2 rounded-lg text-xs font-medium transition-all bg-slate-800 text-slate-200 shadow";
            }

            updateNotifBadge();
        }

        function processMinuteTick() {
            if (appState.isCharging) {
                if (appState.batteryLevel < 100) {
                    appState.batteryLevel += 1;
                    saveState();
                }
            } else {
                if (appState.batteryLevel > 0) {
                    appState.batteryLevel -= 1;
                    saveState();
                }
            }
        }

        setInterval(processMinuteTick, 60000);

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = "pointer-events-auto bg-slate-900 border border-slate-700 text-slate-100 text-xs px-3.5 py-2.5 rounded-xl shadow-2xl flex items-center justify-between transition-all duration-300 transform translate-y-[-10px] opacity-0";
            
            toast.innerHTML = `
                <div class="flex items-center gap-2">
                    <i class="fa-solid ${type === 'success' ? 'fa-circle-check text-emerald-400' : 'fa-circle-info text-blue-400'} text-sm"></i>
                    <span>${message}</span>
                </div>
            `;

            container.appendChild(toast);
            
            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-[-10px]', 'opacity-0');
            });

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-[-10px]');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function showActionableToast(message, buttonText, onClickAction) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = "pointer-events-auto bg-slate-900 border border-amber-500/40 text-slate-100 text-xs p-3 rounded-xl shadow-2xl flex flex-col gap-2 transition-all duration-300";

            toast.innerHTML = `
                <div class="flex items-center gap-2 text-amber-300">
                    <i class="fa-solid fa-triangle-exclamation text-sm"></i>
                    <span class="font-medium">${message}</span>
                </div>
                <button id="toastActionBtn" class="w-full py-1.5 rounded-lg bg-blue-600 text-white font-semibold text-xs active:scale-95 transition">
                    ${buttonText}
                </button>
            `;

            container.appendChild(toast);

            toast.querySelector('#toastActionBtn').addEventListener('click', () => {
                onClickAction();
                toast.remove();
            });

            setTimeout(() => {
                if (toast.parentNode) toast.remove();
            }, 10000);
        }

        window.addEventListener('DOMContentLoaded', () => {
            updateUI();
            checkUnlockNotificationTimer();
            checkLowBatteryAlert();

            const garageModal = document.getElementById('garageModal');
            const settingsModal = document.getElementById('settingsModal');

            document.getElementById('garageMenuBtn').addEventListener('click', () => {
                renderGarageList();
                garageModal.classList.remove('hidden');
            });

            document.getElementById('closeGarageBtn').addEventListener('click', () => garageModal.classList.add('hidden'));

            document.getElementById('addCarBtn').addEventListener('click', () => {
                const newId = 'car_' + Date.now();
                const newCar = {
                    ...DEFAULT_CAR,
                    id: newId,
                    carName: `Car ${garage.length + 1}`,
                    batteryLevel: Math.floor(Math.random() * 40) + 50
                };
                garage.push(newCar);
                switchCar(newId);
                garageModal.classList.add('hidden');
            });

            document.getElementById('settingsMenuBtn').addEventListener('click', () => {
                settingsModal.classList.remove('hidden');
            });

            document.getElementById('closeSettingsBtn').addEventListener('click', () => settingsModal.classList.add('hidden'));

            let valetMode = false;
            document.getElementById('valetModeBtn').addEventListener('click', () => {
                valetMode = !valetMode;
                const status = document.getElementById('valetStatusText');
                status.textContent = valetMode ? "ACTIVE (25 MPH)" : "OFF";
                status.className = valetMode ? "text-[10px] px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400 font-bold" : "text-[10px] px-2 py-0.5 rounded bg-slate-800 text-slate-400";
                showToast(valetMode ? "Valet Mode Activated (Speed capped at 25 MPH)" : "Valet Mode Disabled", "info");
            });

            document.getElementById('runDiagBtn').addEventListener('click', () => {
                settingsModal.classList.add('hidden');
                showToast("Running System Diagnostics...", "info");
                setTimeout(() => {
                    showToast("All Systems Normal: Battery, Climate, Tires OK", "success");
                }, 1500);
            });

            document.getElementById('panicAlarmBtn').addEventListener('click', () => {
                settingsModal.classList.add('hidden');
                showToast("🚨 PANIC ALARM ACTIVATED!", "info");
            });

            document.getElementById('resetAppBtn').addEventListener('click', () => {
                localStorage.removeItem('apex_garage_cars');
                localStorage.removeItem('apex_active_car_id');
                garage = JSON.parse(JSON.stringify(PRESET_CARS));
                activeCarId = garage[0].id;
                appState = getActiveCarState();
                saveState();
                settingsModal.classList.add('hidden');
                showToast("All vehicle states reset", "info");
            });

            const carNameInput = document.getElementById('carNameInput');
            carNameInput.addEventListener('change', (e) => {
                appState.carName = e.target.value.trim() || "Car 1";
                saveState();
                showToast(`Renamed car to ${appState.carName}`, "success");
            });

            document.getElementById('requestNotifBtn').addEventListener('click', () => {
                requestNotificationPermission();
            });

            document.getElementById('lockBtn').addEventListener('click', () => {
                appState.isLocked = !appState.isLocked;
                saveState();
                showToast(appState.isLocked ? "Vehicle Locked" : "Vehicle Unlocked", "success");
            });

            document.getElementById('engineBtn').addEventListener('click', () => {
                appState.engineOn = !appState.engineOn;
                saveState();
                showToast(appState.engineOn ? "Engine Started" : "Engine Turned Off", "success");
            });

            document.getElementById('climateBtn').addEventListener('click', () => {
                appState.climateOn = !appState.climateOn;
                saveState();
                showToast(appState.climateOn ? "Cabin Climate Active" : "Climate Turned Off", "info");
            });

            document.getElementById('flashBtn').addEventListener('click', () => {
                const beams = document.getElementById('headlightBeams');
                beams.style.opacity = "1";
                showToast("Flashing Lights & Horn", "info");
                setTimeout(() => {
                    if (!appState.engineOn) beams.style.opacity = "0";
                }, 1200);
            });

            document.getElementById('chargeOnBtn').addEventListener('click', () => {
                appState.isCharging = true;
                saveState();
                showToast("Charger Connected.", "success");
            });

            document.getElementById('chargeOffBtn').addEventListener('click', () => {
                appState.isCharging = false;
                saveState();
                showToast("Charger Disconnected.", "info");
            });

            document.getElementById('simMinuteBtn').addEventListener('click', () => {
                processMinuteTick();
                showToast(appState.isCharging ? "Simulated +1 min: Battery +1%" : "Simulated +1 min: Battery -1%", "info");
            });

            document.getElementById('tempUpBtn').addEventListener('click', () => {
                if (appState.targetTemp < 85) {
                    appState.targetTemp += 1;
                    saveState();
                }
            });

            document.getElementById('tempDownBtn').addEventListener('click', () => {
                if (appState.targetTemp > 60) {
                    appState.targetTemp -= 1;
                    saveState();
                }
            });

            const carplayView = document.getElementById('carplayView');
            document.getElementById('carplayToggleBtn').addEventListener('click', () => {
                carplayView.classList.remove('hidden');
            });

            document.getElementById('exitCarplayBtn').addEventListener('click', () => {
                carplayView.classList.add('hidden');
            });

            let isPlaying = false;
            const playBtn = document.getElementById('carplayPlayBtn');
            playBtn.addEventListener('click', () => {
                isPlaying = !isPlaying;
                playBtn.innerHTML = isPlaying ? '<i class="fa-solid fa-pause"></i>' : '<i class="fa-solid fa-play"></i>';
            });
        });
    </script>
</body>
</html>
